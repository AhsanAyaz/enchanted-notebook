services:
  db:
    image: postgres:15-alpine
    container_name: enchanted-notes-db
    environment:
      POSTGRES_USER: enchanted_user
      POSTGRES_PASSWORD: enchanted_password
      POSTGRES_DB: enchanted_notes
    ports:
      - '5432:5432'
    volumes:
      - enchanted_notes_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U enchanted_user -d enchanted_notes']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  enchanted_notes_pgdata:
